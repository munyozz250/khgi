<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAPPY BIRTHDAY LUTENDO 🎉</title>
    <style>
        body {
            margin: 0;
            background-color: #0f0a14;
            color: white;
            font-family: 'SansSerif', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-y: auto;
            text-align: center;
            padding: 20px 0;
        }
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }
        .content-container {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 600px;
            padding: 0 20px;
        }
        .age-frame {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: rgba(255, 105, 130, 0.2);
            border: 4px solid white;
            box-shadow: 0 0 25px rgba(255, 105, 130, 0.6);
            display: none;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
        }
        .age-frame h2 {
            font-size: 55px;
            margin: 0;
            color: #ffd700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }
        .video-frame {
            width: 240px;
            max-height: 280px;
            border-radius: 16px;
            border: 4px solid white;
            box-shadow: 0 0 20px rgba(255, 105, 130, 0.5);
            display: none;
            margin-bottom: 15px;
            object-fit: cover;
        }
        .message-box {
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }
        .message-box h1 {
            font-size: 26px;
            color: #ffebeb;
            margin: 10px 0;
        }
        .message-box p.date {
            font-size: 15px;
            color: #ffb4be;
            margin: 5px 0;
        }
        .message-box p.sentiment {
            font-size: 14px;
            color: #dc8cd2;
            margin: 5px 0;
        }
        .message-box p.special {
            font-size: 18px;
            font-weight: bold;
            font-style: italic;
            color: #ffd700;
            margin: 15px 0;
        }
        button {
            position: relative;
            z-index: 2;
            margin-top: 20px;
            background-color: #c81428;
            color: white;
            border: none;
            padding: 15px 35px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(200, 20, 40, 0.4);
            transition: background 0.2s;
        }
        button:hover {
            background-color: #e61e38;
        }
    </style>
</head>
<body>

    <canvas id="balloonCanvas"></canvas>

    <div class="content-container">
        <div class="age-frame" id="ageFrame">
            <h2>20</h2>
        </div>

        <!-- Video Player element -->
        <video class="video-frame" id="videoFrame" controls>
            <source src="video1.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>

        <div class="message-box" id="messageBox">
            <h1>Happy Birthday, Lutendo! 🎉❤️</h1>
            <p class="date">Since September 7th, when you agreed to be my girlfriend</p>
            <p class="sentiment">I honestly don't even know how to put into words how much you mean to me...</p>
            <p class="special">✨ Have a lovely day & Little things do matter ✨</p>
        </div>

        <button id="actionBtn" onclick="triggerCelebration()">Press Me ❤️</button>
    </div>

    <script>
        const canvas = document.getElementById('balloonCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let activated = false;
        let balloons = [];

        class Balloon {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 1.5;
                this.vy = -1 - Math.random() * 2.5;
                this.size = 25 + Math.random() * 15;
                this.color = color;
                this.wobbleSpeed = 0.02 + Math.random() * 0.03;
                this.wobbleAngle = Math.random() * Math.PI * 2;
            }
            update() {
                this.wobbleAngle += this.wobbleSpeed;
                this.x += this.vx + Math.sin(this.wobbleAngle) * 0.8;
                this.y += this.vy;
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.beginPath();
                ctx.ellipse(0, 0, this.size, this.size * 1.2, 0, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();

                ctx.beginPath();
                ctx.ellipse(-this.size * 0.3, -this.size * 0.4, this.size * 0.2, this.size * 0.35, -Math.PI / 6, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
                ctx.fill();

                ctx.beginPath();
                ctx.moveTo(0, this.size * 1.2);
                ctx.lineTo(0, this.size * 2.2);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
                ctx.lineWidth = 1.5;
                ctx.stroke();
                ctx.restore();
            }
        }

        for (let i = 0; i < 25; i++) {
            let colors = ['#ff477e', '#ff70a6', '#ff9770', '#ffd670', '#70d6ff', '#e0aaff'];
            balloons.push(new Balloon(Math.random() * canvas.width, canvas.height + Math.random() * canvas.height, colors[Math.floor(Math.random() * colors.length)]));
        }

        function triggerCelebration() {
            const btn = document.getElementById('actionBtn');
            const msgBox = document.getElementById('messageBox');
            const ageFrame = document.getElementById('ageFrame');
            const videoFrame = document.getElementById('videoFrame');

            if (activated) {
                activated = false;
                btn.innerText = "Press Me ❤️";
                msgBox.style.opacity = 0;
                ageFrame.style.display = 'none';
                videoFrame.style.display = 'none';
                videoFrame.pause();
                return;
            }

            activated = true;
            btn.innerText = "Press Again ❤️";

            let burstColors = ['#ff1493', '#ff69b4', '#ff4500', '#ffd700', '#00ffff', '#ba55d3'];
            for (let i = 0; i < 40; i++) {
                balloons.push(new Balloon(canvas.width / 2 + (Math.random() - 0.5) * 200, canvas.height + 50, burstColors[Math.floor(Math.random() * burstColors.length)]));
            }

            setTimeout(() => {
                msgBox.style.opacity = 1;
                ageFrame.style.display = 'flex';
                videoFrame.style.display = 'block';
            }, 500);
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = balloons.length - 1; i >= 0; i--) {
                let b = balloons[i];
                b.update();
                b.draw();
                if (b.y < -60) {
                    b.y = canvas.height + 50;
                    b.x = Math.random() * canvas.width;
                }
            }
            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
